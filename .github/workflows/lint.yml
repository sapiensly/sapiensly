name: linter

on:
  push:
    branches:
      - develop
      - main
      - workos
  pull_request:
    branches:
      - develop
      - main
      - workos

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm install

      - name: Run Pint
        run: vendor/bin/pint

      # Wayfinder's output is gitignored, so a fresh checkout has no
      # `@/routes` or `@/actions` to resolve — the type check would report a
      # hundred missing modules and say nothing about the code. `--with-form`
      # matches the vite plugin's `formVariants: true`; without it the .form
      # helpers several pages call would not be generated.
      - name: Generate Wayfinder Files
        run: |
          cp -n .env.example .env
          php artisan key:generate
          php artisan wayfinder:generate --with-form

      - name: Format Frontend
        run: npm run format

      - name: Lint Frontend
        run: npm run lint

      - name: Type Check Frontend
        run: npm run type-check

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v5
      #   with:
      #     commit_message: fix code style
      #     commit_options: '--no-verify'
